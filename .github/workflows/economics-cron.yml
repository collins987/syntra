name: Nightly Economics

on:
  schedule:
    # 00:07 UTC daily — offset from :00 to avoid GitHub Actions peak load.
    # Writes org_cost_ledger for the current month, resets monthly execution
    # counts on the 1st, and drains the automation retry queue.
    - cron: "7 0 * * *"
  workflow_dispatch:

jobs:
  economics:
    name: Update cost ledger + drain retry queue
    runs-on: ubuntu-latest
    steps:
      - name: Run economics cron
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/economics" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 60)

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json || true

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Economics cron succeeded"
          else
            echo "Economics cron failed with HTTP $HTTP_STATUS"
            exit 1
          fi
