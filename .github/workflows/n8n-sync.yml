name: n8n Workflow Sync

on:
  schedule:
    # Every 15 minutes — keeps automations table in sync with Azure n8n instance
    - cron: "*/15 * * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    name: Sync n8n workflows
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/n8n/sync" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30)

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Sync succeeded"
          elif [ "$HTTP_STATUS" = "503" ] || [ "$HTTP_STATUS" = "504" ]; then
            # n8n instance is stopped — not a failure, just unavailable
            echo "n8n instance unavailable (HTTP $HTTP_STATUS) — skipping"
            exit 0
          else
            echo "Sync failed with HTTP $HTTP_STATUS"
            exit 1
          fi
